name: Publish extension ZIP releases

on:
  push:
    branches:
      - MEESHO-A-PLUS-LISTING-AUTOMATION-PRO-3.16.4
      - MEESHO-A-PLUS-LISTING-AUTOMATION-PRO-3.16.5
      - publish-flipkart-1-6-8-assets-20261010

permissions:
  contents: write

jobs:
  publish:
    if: startsWith(github.ref_name, 'MEESHO-A-PLUS-LISTING-AUTOMATION-PRO-') || github.ref_name == 'publish-flipkart-1-6-8-assets-20261010'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4

      - name: Build and validate standalone Meesho extension ZIP
        if: startsWith(github.ref_name, 'MEESHO-A-PLUS-LISTING-AUTOMATION-PRO-')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#MEESHO-A-PLUS-LISTING-AUTOMATION-PRO-}"
          python - "$VERSION" <<'PY'
          import json, sys
          expected = sys.argv[1]
          with open('manifest.json', encoding='utf-8') as f:
              m = json.load(f)
          assert m.get('name') == 'MEESHO A+ LISTING AUTOMATION PRO', m.get('name')
          assert m.get('version') == expected, (m.get('version'), expected)
          PY
          ASSET="MEESHO_A_PLUS_LISTING_AUTOMATION_PRO_${VERSION}.zip"
          zip -rq "$ASSET" . -x '.git/*' '.github/*' "$ASSET"
          unzip -t "$ASSET"
          python - "$ASSET" "$VERSION" <<'PY'
          import json, sys, zipfile
          asset, expected = sys.argv[1], sys.argv[2]
          z = zipfile.ZipFile(asset)
          assert z.testzip() is None
          m = json.loads(z.read('manifest.json'))
          assert m.get('name') == 'MEESHO A+ LISTING AUTOMATION PRO'
          assert m.get('version') == expected
          print('ZIP verified:', asset, 'version', expected, 'files', len(z.namelist()))
          PY

      - name: Assemble and validate standalone Flipkart extension ZIP
        if: github.ref_name == 'publish-flipkart-1-6-8-assets-20261010'
        shell: bash
        run: |
          set -euo pipefail
          ASSET='release-assets/FLIPKART_A_PLUS_LISTING_AUTOMATION_PRO_1.6.8_LOCAL_ONLY_PROFILES.zip'
          mkdir -p release-assets
          cat release-assets/final/flipkart-zip-b64-*.txt | tr -d '\r\n' | base64 --decode > "$ASSET"
          unzip -p "$ASSET" manifest.json > /tmp/flipkart-manifest.json
          python - "$ASSET" <<'PY'
          import json, sys, zipfile
          asset = sys.argv[1]
          with open('/tmp/flipkart-manifest.json', encoding='utf-8') as f:
              m = json.load(f)
          assert m.get('name') == 'FLIPKART A+ LISTING AUTOMATION PRO', m.get('name')
          assert m.get('version') == '1.6.8', m.get('version')
          z = zipfile.ZipFile(asset)
          assert z.testzip() is None
          assert 'manifest.json' in z.namelist()
          print('ZIP verified:', asset, 'version', m['version'], 'files', len(z.namelist()))
          PY
          unzip -t "$ASSET"

      - name: Set release metadata
        id: meta
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == "publish-flipkart-1-6-8-assets-20261010" ]]; then
            echo "tag_name=flipkart-v1.6.8" >> "$GITHUB_OUTPUT"
            echo "release_name=FLIPKART A+ LISTING AUTOMATION PRO v1.6.8" >> "$GITHUB_OUTPUT"
            echo "asset=release-assets/FLIPKART_A_PLUS_LISTING_AUTOMATION_PRO_1.6.8_LOCAL_ONLY_PROFILES.zip" >> "$GITHUB_OUTPUT"
          else
            VERSION="${GITHUB_REF_NAME#MEESHO-A-PLUS-LISTING-AUTOMATION-PRO-}"
            echo "tag_name=meesho-v${VERSION}" >> "$GITHUB_OUTPUT"
            echo "release_name=MEESHO A+ LISTING AUTOMATION PRO v${VERSION}" >> "$GITHUB_OUTPUT"
            echo "asset=MEESHO_A_PLUS_LISTING_AUTOMATION_PRO_${VERSION}.zip" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release with ZIP asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: ${{ steps.meta.outputs.release_name }}
          files: ${{ steps.meta.outputs.asset }}
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
