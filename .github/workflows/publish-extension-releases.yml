name: Publish extension ZIP releases

on:
  push:
    branches:
      - MEESHO-A-PLUS-LISTING-AUTOMATION-PRO-3.16.4
      - publish-flipkart-1-6-8-20261009

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4

      - name: Build and validate Meesho extension ZIP
        if: github.ref_name == 'MEESHO-A-PLUS-LISTING-AUTOMATION-PRO-3.16.4'
        shell: bash
        run: |
          python - <<'PY'
          import json
          with open('manifest.json', encoding='utf-8') as f:
              m = json.load(f)
          assert m.get('name') == 'MEESHO A+ LISTING AUTOMATION PRO', m.get('name')
          assert m.get('version') == '3.16.4', m.get('version')
          PY
          zip -rq MEESHO_A_PLUS_LISTING_AUTOMATION_PRO_3.16.4.zip . -x '.git/*' '.github/*' 'MEESHO_A_PLUS_LISTING_AUTOMATION_PRO_3.16.4.zip'
          unzip -t MEESHO_A_PLUS_LISTING_AUTOMATION_PRO_3.16.4.zip
          python - <<'PY'
          import zipfile
          z = zipfile.ZipFile('MEESHO_A_PLUS_LISTING_AUTOMATION_PRO_3.16.4.zip')
          assert z.testzip() is None
          assert 'manifest.json' in z.namelist()
          PY

      - name: Validate supplied Flipkart extension ZIP
        if: github.ref_name == 'publish-flipkart-1-6-8-20261009'
        shell: bash
        run: |
          asset='release-assets/FLIPKART_A_PLUS_LISTING_AUTOMATION_PRO_1.6.8_LOCAL_ONLY_PROFILES.zip'
          test -f "$asset"
          unzip -p "$asset" manifest.json > /tmp/flipkart-manifest.json
          python - <<'PY'
          import json
          with open('/tmp/flipkart-manifest.json', encoding='utf-8') as f:
              m = json.load(f)
          assert m.get('name') == 'FLIPKART A+ LISTING AUTOMATION PRO', m.get('name')
          assert m.get('version') == '1.6.8', m.get('version')
          PY
          unzip -t "$asset"

      - name: Set release metadata
        id: meta
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == "MEESHO-A-PLUS-LISTING-AUTOMATION-PRO-3.16.4" ]]; then
            echo "tag_name=meesho-v3.16.4" >> "$GITHUB_OUTPUT"
            echo "release_name=MEESHO A+ LISTING AUTOMATION PRO v3.16.4" >> "$GITHUB_OUTPUT"
            echo "asset=MEESHO_A_PLUS_LISTING_AUTOMATION_PRO_3.16.4.zip" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=flipkart-v1.6.8" >> "$GITHUB_OUTPUT"
            echo "release_name=FLIPKART A+ LISTING AUTOMATION PRO v1.6.8" >> "$GITHUB_OUTPUT"
            echo "asset=release-assets/FLIPKART_A_PLUS_LISTING_AUTOMATION_PRO_1.6.8_LOCAL_ONLY_PROFILES.zip" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release with ZIP asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: ${{ steps.meta.outputs.release_name }}
          files: ${{ steps.meta.outputs.asset }}
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
