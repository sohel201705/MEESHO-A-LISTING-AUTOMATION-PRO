name: Validate Free Admin and Extension Source

on:
  pull_request:
    branches: [main]
    paths:
      - 'Extension/**'
      - 'admin/**'
      - 'firebase/**'
      - '.github/workflows/validate-source.yml'
      - 'README.md'
      - 'SETUP_GITHUB_FIREBASE.md'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate JSON files
        shell: bash
        run: |
          node -e "for (const f of ['Extension/manifest.json','firebase/firebase.json']) { JSON.parse(require('node:fs').readFileSync(f, 'utf8')); console.log('JSON OK:', f); }"

      - name: Check JavaScript syntax
        shell: bash
        run: |
          node --check Extension/background.js
          node --check Extension/popup.js
          node --check Extension/js/aiCatalogAssistant.js
          node --check Extension/js/sellerOnboarding.js
          node --check Extension/content.js
          node --check Extension/interceptor.js
          node --check Extension/js/meeshoApi.js
          node --check Extension/js/shippingOptimizer.js
          node --input-type=module --check < admin/admin.js

      - name: Setup Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile Firestore Rules with the local emulator
        run: npx --yes firebase-tools emulators:exec --only firestore --config firebase/firebase.json --project demo-free-mode "echo Firestore Rules compiled in emulator."

      - name: Verify free-mode backup and membership safeguards
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const manifest = JSON.parse(fs.readFileSync('Extension/manifest.json', 'utf8'));
          const firebaseConfig = JSON.parse(fs.readFileSync('firebase/firebase.json', 'utf8'));
          const rules = fs.readFileSync('firebase/firestore.rules', 'utf8');
          const admin = fs.readFileSync('admin/admin.js', 'utf8');
          const html = fs.readFileSync('admin/index.html', 'utf8');
          const background = fs.readFileSync('Extension/background.js', 'utf8');
          const popup = fs.readFileSync('Extension/popup.js', 'utf8');
          const content = fs.readFileSync('Extension/content.js', 'utf8');
          const shipping = fs.readFileSync('Extension/js/shippingOptimizer.js', 'utf8');
          const aiAssistant = fs.readFileSync('Extension/js/aiCatalogAssistant.js', 'utf8');
          const popupHtml = fs.readFileSync('Extension/popup.html', 'utf8');
          const onboarding = fs.readFileSync('Extension/js/sellerOnboarding.js', 'utf8');
          assert.equal(manifest.name, 'MEESHO A+ LISTING AUTOMATION PRO');
          assert.equal(manifest.version, '3.17.9');
          assert.ok(!manifest.host_permissions.some(x => /codes-market|supabase/i.test(x)));
          assert.ok(!popup.includes('codes-market.xyz'));
          assert.ok(!popup.includes('syncProfilesFromBackend'));
          assert.ok(!popup.includes('pushProfileToBackend'));
          assert.ok(!popup.includes('deleteProfileOnBackend'));
          assert.ok(!content.includes('codes-market.xyz'));
          assert.ok(!shipping.includes('codes-market.xyz'));
          assert.ok(popup.includes("chrome.storage.local.set({ meesho_profiles: merged }"));
          assert.ok(!JSON.stringify(firebaseConfig).includes('functions'));
          assert.ok(!background.includes('cloudfunctions.net'));
          assert.ok(!background.includes('httpsCallable'));
          assert.ok(!manifest.host_permissions.some(x => x.includes('cloudfunctions.net')));
          assert.match(rules, /YnfQtmTpm9asdR0izeWuMwmX3Sw1/);
          assert.match(rules, /canRedeemProductMembership/);
          assert.match(rules, /match \/flipkartProfiles\/\{profileId\} \{\s*allow read, create, update, delete: if isAdmin\(\);/);
          assert.ok(admin.includes('downloadLocalBackup'));
          assert.ok(admin.includes('restoreLocalBackupFile'));
          assert.ok(admin.includes('resetKnownAppData'));
          assert.ok(!admin.includes('factoryResetCallable'));
          assert.ok(html.includes('backup-file-input'));
          assert.ok(html.includes('Download Backup (JSON)'));
          assert.ok(admin.includes("snap.docs.filter(d=>d.id!=='_meta')"));
          assert.ok(aiAssistant.includes('function isGarmentMeasurement'));
          assert.ok(aiAssistant.includes('explicitDimension'));
          assert.ok(aiAssistant.includes('gemini-3.8-flash'));
          assert.ok(aiAssistant.includes('gemini-3.6-flash'));
          assert.ok(aiAssistant.includes('gemini-3.5-flash-lite'));
          assert.ok(aiAssistant.includes('gemini-3.1-flash-lite'));
          assert.ok(aiAssistant.includes('qwen/qwen3.8-27b'));
          assert.ok(aiAssistant.includes('Bulk add complete'));
          assert.ok(aiAssistant.includes('callAI(promptFor(scan,p,d,s,researchNow),imgs,46,25)'));
          assert.ok(aiAssistant.includes('Array.isArray(imgs)'));
          assert.ok(aiAssistant.includes('redactSecrets(e,k)'));
          assert.ok(aiAssistant.includes('imgs.slice(0,3)'));
          assert.ok(aiAssistant.includes("k.provider!=='groq'&&/^gsk_/i.test(apiKey)"));
          assert.ok(aiAssistant.includes("k.provider!=='gemini'&&/^AIzaSy/i.test(apiKey)"));
          assert.ok(aiAssistant.includes("if(/^gsk_/i.test(apiKey))p='groq';else if(/^AIzaSy/i.test(apiKey))p='gemini'"));
          assert.ok(aiAssistant.includes('function modelChoices(p)'));
          assert.ok(popupHtml.includes('ai-model-options'));
          assert.ok(popupHtml.includes('js/aiCatalogAssistant.js'));
          assert.ok(manifest.host_permissions.includes('https://generativelanguage.googleapis.com/*'));
          assert.ok(manifest.host_permissions.includes('https://api.groq.com/*'));
          assert.ok(manifest.optional_host_permissions.includes('https://*/*'));
          assert.ok(aiAssistant.includes('function researchProduct'));
          assert.ok(aiAssistant.includes('function officialTaxEvidence'));
          assert.ok(aiAssistant.includes('function productCodes'));
          assert.ok(aiAssistant.includes('function generatedCodeForField'));
          assert.ok(aiAssistant.includes('function exactCapacityOption'));
          assert.ok(aiAssistant.includes('Google Research Sources'));
          assert.ok(aiAssistant.includes('callAI(promptFor(scan,p,d,s,researchNow),imgs,46,25)'));
          assert.ok(aiAssistant.includes("payload._variation_sizes=selected.join(',')"));
          assert.ok(aiAssistant.includes('#dynamic-sections-container [id^="f_"]'));
          assert.ok(popupHtml.includes('id="ai-product-capacity"'));
          assert.ok(popupHtml.includes('id="ai-variation-sizes"'));
          assert.ok(popupHtml.includes('id="ai-research-sources"'));
          assert.ok(content.includes('function sizeOptionContainer(option, menu)'));
          assert.ok(content.includes('Selected size(s) could not be matched'));
          assert.ok(content.includes("add_ons: ['add ons'"));
          assert.ok(content.includes('bis_isi_certification_number'));
          assert.ok(content.includes('cm_l_number'));
          assert.ok(aiAssistant.includes('function calculateWrongReturnPrice'));
          assert.ok(aiAssistant.includes('return n!==null&&n>5?formatMoney(n-5):'));
          assert.ok(aiAssistant.includes('function updatePricePreview'));
          assert.ok(aiAssistant.includes('function mergeImageBatchResponses'));
          assert.ok(aiAssistant.includes('imgs.length>10'));
          assert.ok(aiAssistant.includes("k.provider==='groq'||(k.provider==='openrouter'"));
          assert.ok(aiAssistant.includes("inventory:inventoryInput"));
          assert.ok(aiAssistant.includes("p.wrongReturnPrice=calculateWrongReturnPrice(p.sellingPrice)"));
          assert.ok(aiAssistant.includes("Meesho selling price must be greater than ₹5"));
          assert.ok(aiAssistant.includes("Entered MRP is lower than the selling price"));
          assert.ok(aiAssistant.includes("maxEdge=1600"));
          assert.ok(!aiAssistant.includes("'image/gif'"));
          assert.ok(!popupHtml.includes('image/gif'));
          assert.ok(aiAssistant.includes("All '+imgs.length+' photos were sent"));
          assert.ok(aiAssistant.includes('function liveLog'));
          assert.ok(aiAssistant.includes('LIVE PROCESS CONSOLE') || popupHtml.includes('LIVE PROCESS CONSOLE'));
          assert.ok(aiAssistant.includes("ai-product-price').addEventListener('input',updatePricePreview)"));
          assert.ok(popupHtml.includes('id="ai-product-return-price"'));
          assert.ok(popupHtml.includes('id="ai-product-mrp"'));
          assert.ok(popupHtml.includes('id="ai-product-inventory"'));
          assert.ok(popupHtml.includes('up to 10 photos'));
          assert.ok(popupHtml.includes('ai-live-console'));
          assert.ok(popupHtml.includes('Premium graphite + midnight-blue AI workspace'));
          assert.ok(aiAssistant.includes("PROFILE_DB='ai_seller_profiles_v1'"));
          assert.ok(aiAssistant.includes('async function getActiveDefaultsForCategory(category)'));
          assert.ok(aiAssistant.includes('async function saveCategoryOverride()'));
          assert.ok(aiAssistant.includes('ai-default-manufacturer-pincode'));
          assert.ok(aiAssistant.includes('ai-override-importer-pincode'));
          assert.ok(aiAssistant.includes('function buildTitleChoices'));
          assert.ok(aiAssistant.includes('slice(0,250)'));
          assert.ok(aiAssistant.includes('recommended=true for exactly one'));
          assert.ok(aiAssistant.includes('function renderTitleOptions'));
          assert.ok(aiAssistant.includes('async function applyTitleChoice(index)'));
          assert.ok(aiAssistant.includes('function isDescriptionField(f)'));
          assert.ok(aiAssistant.includes('function normalizeDescription(text)'));
          assert.ok(aiAssistant.includes('function refineDescriptionToBudget'));
          assert.ok(aiAssistant.includes('950–1000 characters'));
          assert.ok(aiAssistant.includes('async function callTextAI(prompt)'));
          assert.ok(aiAssistant.includes("await gemini(k,prompt,[])"));
          assert.ok(aiAssistant.includes("await compatible(k,prompt,[])"));
          assert.ok(aiAssistant.includes('async function sendChatMessage()'));
          assert.ok(aiAssistant.includes("chrome.runtime.onMessage.addListener(message=>"));
          assert.ok(aiAssistant.includes("message.type==='AUTOFILL_PROGRESS'"));
          assert.ok(popupHtml.includes('id="ai-profile-select"'));
          assert.ok(popupHtml.includes('id="ai-profile-category"'));
          assert.ok(popupHtml.includes('id="ai-title-options"'));
          assert.ok(popupHtml.includes('id="ai-chat-input"'));
          assert.ok(popupHtml.includes('id="ai-progress-percent"'));
          assert.ok(content.includes('const reportAutofillProgress='));
          assert.ok(content.includes("type:'AUTOFILL_PROGRESS'"));
          assert.ok(aiAssistant.includes("function switchAiDashboardPage(page)"));
          assert.ok(aiAssistant.includes("function profileDbKey()"));
          assert.ok(aiAssistant.includes("function defaultsStoreKey()"));
          assert.ok(aiAssistant.includes("seller-profile-saved"));
          assert.ok(popup.includes("function sellerIdentity(user=currentUser)"));
          assert.ok(popup.includes("function sellerProfileDbKey(user=currentUser)"));
          assert.ok(popup.includes("function sellerDefaultsStorageKey(user=currentUser)"));
          assert.ok(popup.includes("showView('onboarding')"));
          assert.ok(popup.includes("async function saveInitialSellerProfile()"));
          assert.ok(onboarding.includes("saveInitialSellerProfile()"));
          assert.ok(popupHtml.includes('id="view-onboarding"'));
          assert.ok(popupHtml.includes('id="onboard-save-continue"'));
          assert.ok(popupHtml.includes('ai-dashboard-shell'));
          assert.ok(popupHtml.includes('data-ai-page="listing"'));
          assert.ok(popupHtml.includes('data-ai-page="profile"'));
          assert.ok(popupHtml.includes('data-ai-page="api"'));
          assert.ok(popupHtml.includes('data-ai-page="chat"'));
          assert.ok(popupHtml.includes('data-ai-page="activity"'));
          assert.ok(popupHtml.includes('id="ai-page-listing"'));
          assert.ok(popupHtml.includes('id="ai-page-profile"'));
          assert.ok(popupHtml.includes('id="ai-page-api"'));
          assert.ok(popupHtml.includes('id="ai-page-chat"'));
          assert.ok(popupHtml.includes('id="ai-page-activity"'));
          assert.ok(popupHtml.includes('Premium dashboard workspace: separate focused pages + neon edge glow'));

          // Regression: category is inferred from the already-selected Meesho form,
          // and initialized before productCategory is included in the request.
          assert.ok(aiAssistant.includes('function detectMeeshoCatalog(scan)'));
          const generateStart = aiAssistant.indexOf('async function generate(googleAllowed){');
          const generateEnd = aiAssistant.indexOf('async function autofill()', generateStart);
          assert.ok(generateStart >= 0 && generateEnd > generateStart);
          const generateCode = aiAssistant.slice(generateStart, generateEnd);
          assert.ok(generateCode.indexOf('let category=detectedCatalog.key') < generateCode.indexOf('productCategory:category'));
          assert.ok(generateCode.includes('scanCurrentCatalog(false)'));
          assert.ok(generateCode.includes('visionRefined=detectMeeshoCatalog(scan)'));
          assert.ok(!generateCode.includes("const category=$('ai-profile-category')"));
          assert.ok(aiAssistant.includes('Auto-detected from selected Meesho catalog:'));
          assert.ok(content.includes('result.catalogContext = Object.assign'));
          assert.ok(content.includes("mls:request-catalog-context"));
          assert.ok(content.includes("window.addEventListener('mls:catalog-image'"));
          assert.ok(popupHtml.includes('ai-optional-product-details'));
          assert.ok(popupHtml.includes('ai-category-override-details'));
          assert.equal((popupHtml.match(/id="ai-image-list"/g) || []).length, 1);

          const detectorStart = aiAssistant.indexOf('function safeMeeshoCatalogContext(context={})');
          const detectorEnd = aiAssistant.indexOf('function promptFor(scan,p,d,s,research)', detectorStart);
          assert.ok(detectorStart >= 0 && detectorEnd > detectorStart);
          const normalise = value => String(value || '').replace(/[＊*]/g, '').replace(/\s+/g, ' ').trim().toLowerCase();
          const detectCatalog = new Function("$", "norm", aiAssistant.slice(detectorStart, detectorEnd) + "; return detectMeeshoCatalog;")(() => null, normalise);
          const fixture = (fields, capturedValues = {}, catalogContext = {}) => ({
            sections: [{ id: 'product_data', fields }],
            capturedValues,
            catalogContext: Object.assign({ pageTitle: 'Meesho Supplier Panel', headings: ['Add Single Catalog'] }, catalogContext)
          });
          assert.equal(detectCatalog(fixture([
            { identifier: 'capacity_in_l', label: 'Capacity In L' },
            { identifier: 'volume_unit', label: 'Volume Unit' },
            { identifier: 'leak_proof', label: 'Leak Proof' },
            { identifier: 'generic_name', label: 'Generic Name' }
          ], { generic_name: 'Water Bottles' })).key, 'bottles');
          assert.equal(detectCatalog(fixture([
            { identifier: 'sleeve_length', label: 'Sleeve Length' },
            { identifier: 'neck_type', label: 'Neck Type' },
            { identifier: 'fabric', label: 'Fabric' },
            { identifier: 'pattern', label: 'Pattern' }
          ])).key, 'apparel');
          assert.equal(detectCatalog(fixture([
            { identifier: 'number_of_containers', label: 'Number of Containers' },
            { identifier: 'microwave_safe', label: 'Microwave Safe' }
          ])).key, 'kitchen');
          assert.equal(detectCatalog(fixture([
            { identifier: 'seat_height', label: 'Seat Height' },
            { identifier: 'seating_capacity', label: 'Seating Capacity' }
          ], {}, { categoryName: 'Plastic Chairs' })).key, 'furniture');

          // Free Size must target the real checkbox/label row and commit Apply faster.
          assert.ok(content.includes('function sizeOptionContainer(option, menu)'));
          assert.ok(content.includes('function clickSizeRow(row)'));
          assert.ok(content.includes('setTimeout(() => done(null), 750)'));
          assert.ok(content.includes('HTMLElement.click() already emits the native click/input/change sequence'));
          assert.ok(!content.includes("input.dispatchEvent(new Event('change', { bubbles: true }))"));
          assert.ok(content.includes("await sleep(120)"));
          assert.ok(content.includes('Meesho did not display the committed size'));

          // Product taxes: search in parallel, never preserve Meesho's default GST 0,
          // and require an official source before filling an HSN/GST candidate.
          assert.ok(aiAssistant.includes('const outcomes=await Promise.all(queries.map'));
          assert.ok(aiAssistant.includes('MANDATORY HSN/GST CHECK'));
          assert.ok(aiAssistant.includes('function officialTaxEvidence'));
          assert.ok(aiAssistant.includes('if(!OFFICIAL_TAX_HOST.test(host))return null'));
          assert.ok(aiAssistant.includes("['0','0%','--','select','not selected'].includes(norm(oldTax))"));
          assert.ok(aiAssistant.includes("const fixed=isTaxField(f)?'':preset(f,p,d)"));

          // Current front-photo capture and manual-photo alternative in the shipping optimizer.
          assert.ok(shipping.includes('function imageSourceUrl(img)'));
          assert.ok(shipping.includes('let catalogImageObserver = null'));
          assert.ok(shipping.includes('function findFrontImagePreviewUrl()'));
          assert.ok(shipping.includes('mls-manual-image-input'));
          assert.ok(!shipping.includes('candidates[0] || null'));

          // Premium API provider cards and live selection wiring.
          for (const provider of ['gemini','groq','openrouter','xai','together','fireworks','mistral','huggingface','custom']) {
            assert.ok(popupHtml.includes('data-api-provider="' + provider + '"'));
            assert.ok(aiAssistant.includes(provider + ':{') || provider === 'custom');
          }
          assert.ok(aiAssistant.includes('function syncProviderCards()'));
          assert.ok(aiAssistant.includes('qwen/qwen3.8-27b:free'));
          assert.ok(popupHtml.includes('.ai-provider-cards{display:grid'));
          assert.ok(popupHtml.includes('id="ai-product-pack-quantity"'));
          assert.ok(aiAssistant.includes("packQuantity:$('ai-product-pack-quantity')"));
          assert.ok(aiAssistant.includes('function exactPackQuantityOption(field,count)'));
          assert.ok(aiAssistant.includes('productInputs.packQuantity'));
          assert.ok(aiAssistant.includes("raw+=' / Pack of '+packCount"));
          assert.ok(aiAssistant.includes('function classifyProviderFailure(error)'));
          assert.ok(aiAssistant.includes('quota/rate limit (429)'));
          assert.ok(aiAssistant.includes("Provider quota exhausted."));
          assert.ok(aiAssistant.includes('await set({[ROT]:(start+i+1)%list.length})'));
          const classifierStart = aiAssistant.indexOf('function classifyProviderFailure(error){');
          const classifierEnd = aiAssistant.indexOf('function explainProviderFailure', classifierStart);
          assert.ok(classifierStart >= 0 && classifierEnd > classifierStart);
          const classifyProviderFailure = new Function(aiAssistant.slice(classifierStart, classifierEnd) + '; return classifyProviderFailure;')();
          assert.equal(classifyProviderFailure(new Error('Gemini 429: You exceeded your current quota')), 'quota');
          assert.equal(classifyProviderFailure(new Error('HTTP 401: invalid API key')), 'auth');
          const packStart = aiAssistant.indexOf('function exactPackQuantityOption(field,count){');
          const packEnd = aiAssistant.indexOf('function exactCapacityOption', packStart);
          const packOption = new Function('norm', aiAssistant.slice(packStart, packEnd) + '; return exactPackQuantityOption;')(value => String(value || '').replace(/\\s+/g, ' ').trim().toLowerCase());
          assert.equal(packOption({ values: ['Pack Of 1', 'Pack Of 2', 'Pack Of 4'] }, 2), 'Pack Of 2');
          assert.equal(packOption({ values: ['Pack Of 1', 'Pack Of 2'] }, 4), '');
          assert.equal(packOption({ values: [] }, 3), 'Pack Of 3');
          console.log('v3.17.9 checks passed: pack quantity, Gemini quota fallback diagnostics, verified Free Size selection, shipping photo capture, and nine provider cards.');
          NODE
