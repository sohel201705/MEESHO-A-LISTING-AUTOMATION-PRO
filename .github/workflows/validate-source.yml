name: Validate Free Admin and Extension Source

on:
  pull_request:
    branches: [main]
    paths:
      - 'Extension/**'
      - 'admin/**'
      - 'firebase/**'
      - '.github/workflows/validate-source.yml'
      - 'README.md'
      - 'SETUP_GITHUB_FIREBASE.md'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate JSON files
        shell: bash
        run: |
          node -e "for (const f of ['Extension/manifest.json','firebase/firebase.json']) { JSON.parse(require('node:fs').readFileSync(f, 'utf8')); console.log('JSON OK:', f); }"

      - name: Check JavaScript syntax
        shell: bash
        run: |
          node --check Extension/background.js
          node --check Extension/popup.js
          node --check Extension/js/aiCatalogAssistant.js
          node --check Extension/content.js
          node --check Extension/interceptor.js
          node --check Extension/js/meeshoApi.js
          node --check Extension/js/shippingOptimizer.js
          node --input-type=module --check < admin/admin.js

      - name: Setup Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile Firestore Rules with the local emulator
        run: npx --yes firebase-tools emulators:exec --only firestore --config firebase/firebase.json --project demo-free-mode "echo Firestore Rules compiled in emulator."

      - name: Verify free-mode backup and membership safeguards
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const manifest = JSON.parse(fs.readFileSync('Extension/manifest.json', 'utf8'));
          const firebaseConfig = JSON.parse(fs.readFileSync('firebase/firebase.json', 'utf8'));
          const rules = fs.readFileSync('firebase/firestore.rules', 'utf8');
          const admin = fs.readFileSync('admin/admin.js', 'utf8');
          const html = fs.readFileSync('admin/index.html', 'utf8');
          const background = fs.readFileSync('Extension/background.js', 'utf8');
          const popup = fs.readFileSync('Extension/popup.js', 'utf8');
          const content = fs.readFileSync('Extension/content.js', 'utf8');
          const shipping = fs.readFileSync('Extension/js/shippingOptimizer.js', 'utf8');
          const aiAssistant = fs.readFileSync('Extension/js/aiCatalogAssistant.js', 'utf8');
          const popupHtml = fs.readFileSync('Extension/popup.html', 'utf8');
          assert.equal(manifest.name, 'MEESHO A+ LISTING AUTOMATION PRO');
          assert.equal(manifest.version, '3.17.3');
          assert.ok(!manifest.host_permissions.some(x => /codes-market|supabase/i.test(x)));
          assert.ok(!popup.includes('codes-market.xyz'));
          assert.ok(!popup.includes('syncProfilesFromBackend'));
          assert.ok(!popup.includes('pushProfileToBackend'));
          assert.ok(!popup.includes('deleteProfileOnBackend'));
          assert.ok(!content.includes('codes-market.xyz'));
          assert.ok(!shipping.includes('codes-market.xyz'));
          assert.ok(popup.includes("chrome.storage.local.set({ meesho_profiles: merged }"));
          assert.ok(!JSON.stringify(firebaseConfig).includes('functions'));
          assert.ok(!background.includes('cloudfunctions.net'));
          assert.ok(!background.includes('httpsCallable'));
          assert.ok(!manifest.host_permissions.some(x => x.includes('cloudfunctions.net')));
          assert.match(rules, /YnfQtmTpm9asdR0izeWuMwmX3Sw1/);
          assert.match(rules, /canRedeemProductMembership/);
          assert.match(rules, /match \/flipkartProfiles\/\{profileId\} \{\s*allow read, create, update, delete: if isAdmin\(\);/);
          assert.ok(admin.includes('downloadLocalBackup'));
          assert.ok(admin.includes('restoreLocalBackupFile'));
          assert.ok(admin.includes('resetKnownAppData'));
          assert.ok(!admin.includes('factoryResetCallable'));
          assert.ok(html.includes('backup-file-input'));
          assert.ok(html.includes('Download Backup (JSON)'));
          assert.ok(admin.includes("snap.docs.filter(d=>d.id!=='_meta')"));
          assert.ok(aiAssistant.includes('function isGarmentMeasurement'));
          assert.ok(aiAssistant.includes('explicitDimension'));
          assert.ok(aiAssistant.includes('gemini-3.8-flash'));
          assert.ok(aiAssistant.includes('gemini-3.6-flash'));
          assert.ok(aiAssistant.includes('gemini-3.5-flash-lite'));
          assert.ok(aiAssistant.includes('gemini-3.1-flash-lite'));
          assert.ok(aiAssistant.includes('qwen/qwen3.8-27b'));
          assert.ok(aiAssistant.includes('Bulk add complete'));
          assert.ok(aiAssistant.includes('callAI(promptFor(scan,p,d,s),imgs)'));
          assert.ok(aiAssistant.includes('Array.isArray(imgs)'));
          assert.ok(aiAssistant.includes('redactSecrets(e,k)'));
          assert.ok(aiAssistant.includes('imgs.slice(0,3)'));
          assert.ok(aiAssistant.includes("k.provider!=='groq'&&/^gsk_/i.test(apiKey)"));
          assert.ok(aiAssistant.includes("k.provider!=='gemini'&&/^AIzaSy/i.test(apiKey)"));
          assert.ok(aiAssistant.includes("if(/^gsk_/i.test(apiKey))p='groq';else if(/^AIzaSy/i.test(apiKey))p='gemini'"));
          assert.ok(aiAssistant.includes('function modelChoices(p)'));
          assert.ok(popupHtml.includes('ai-model-options'));
          assert.ok(popupHtml.includes('js/aiCatalogAssistant.js'));
          assert.ok(manifest.host_permissions.includes('https://generativelanguage.googleapis.com/*'));
          assert.ok(manifest.host_permissions.includes('https://api.groq.com/*'));
          assert.ok(manifest.optional_host_permissions.includes('https://*/*'));
          assert.ok(aiAssistant.includes('function researchProduct'));
          assert.ok(aiAssistant.includes('function officialTaxEvidence'));
          assert.ok(aiAssistant.includes('function productCodes'));
          assert.ok(aiAssistant.includes('function generatedCodeForField'));
          assert.ok(aiAssistant.includes('function exactCapacityOption'));
          assert.ok(aiAssistant.includes('Google Research Sources'));
          assert.ok(aiAssistant.includes('callAI(promptFor(scan,p,d,s,researchNow),imgs)'));
          assert.ok(aiAssistant.includes("payload._variation_sizes=selected.join(',')"));
          assert.ok(aiAssistant.includes('#dynamic-sections-container [id^="f_"]'));
          assert.ok(popupHtml.includes('id="ai-product-capacity"'));
          assert.ok(popupHtml.includes('id="ai-variation-sizes"'));
          assert.ok(popupHtml.includes('id="ai-research-sources"'));
          assert.ok(content.includes("clickResult==='checkbox-failed'"));
          assert.ok(content.includes('Selected size(s) could not be matched'));
          assert.ok(content.includes("add_ons: ['add ons'"));
          assert.ok(content.includes('bis_isi_certification_number'));
          assert.ok(content.includes('cm_l_number'));
          console.log('Free-mode safeguards and v3.17.3 catalog research/autofill regressions passed.');
          NODE
